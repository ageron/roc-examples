name: Test platform authoring hosts

on:
  pull_request:
    paths:
      - 'examples/PlatformAuthoring/**'
      - 'ci_scripts/test_platform_authoring.roc'
      - 'ci_scripts/example_roc_version.sh'
      - 'ci_scripts/test_example.sh'
      - '.github/workflows/test-platform-authoring.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hosts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.0

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'

      - name: Select Rust
        run: rustup default 1.98.1

      # The example and its test script pin their own Roc versions, so that
      # upgrading the example does not depend on upgrading the script.
      - name: Read the pinned Roc versions
        id: pins
        shell: bash
        run: |
          example="$(./ci_scripts/example_roc_version.sh examples/PlatformAuthoring)"
          script="$(./ci_scripts/example_roc_version.sh ci_scripts/test_platform_authoring.roc)"
          echo "example=$example" >> "$GITHUB_OUTPUT"
          echo "script=$script" >> "$GITHUB_OUTPUT"

      - name: Install the example's Roc
        uses: roc-lang/setup-roc@dd81390553b0a1236aedb61cdd4c0ed7cf7eaec4 # v0.4.0
        with:
          version: nightly
          nightly-tag: ${{ steps.pins.outputs.example }}
          cache: false

      # setup-roc extracts into the workspace, so move this Roc out of the way of
      # the next setup-roc. The test script gets its path as an argument.
      - name: Move the example's Roc aside
        id: example-roc
        shell: bash
        env:
          NIGHTLY_TAG: ${{ steps.pins.outputs.example }}
        run: |
          dir="$RUNNER_TEMP/example-roc"
          mv roc_nightly-*-"${NIGHTLY_TAG#nightly-}" "$dir"
          exe=roc
          if [ "$RUNNER_OS" = Windows ]; then exe=roc.exe; fi
          echo "roc=$dir/$exe" >> "$GITHUB_OUTPUT"

      - name: Install the test script's Roc
        uses: roc-lang/setup-roc@dd81390553b0a1236aedb61cdd4c0ed7cf7eaec4 # v0.4.0
        with:
          version: nightly
          nightly-tag: ${{ steps.pins.outputs.script }}
          cache: false

      # Not bash: on Windows, Git's /usr/bin/link would shadow the MSVC link.exe that rustc needs.
      - name: Build and run every host
        shell: pwsh
        env:
          EXAMPLE_ROC: ${{ steps.example-roc.outputs.roc }}
        run: roc --no-cache ci_scripts/test_platform_authoring.roc $env:EXAMPLE_ROC
